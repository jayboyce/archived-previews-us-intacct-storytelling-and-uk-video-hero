<text fill="black" fill-opacity="0.9" style="white-space: pre" xml:space="preserve" font-family="Sage UI" font-size="10.5696" font-weight="500" letter-spacing="0px"><tspan x="66.2891" y="102.774">At Sage, we build AI for accounting and payroll that&#x2019;s secure, trustworthy and designed with </tspan><tspan x="66.2891" y="118.629">small and medium businesses and accountants in mind. We want you to make informed </tspan><tspan x="66.2891" y="134.483">decisions about using AI in our products. Our AI Trust Label is designed to provide you with </tspan><tspan x="66.2891" y="150.338">clear, accessible information about the way AI functions across Sage products.</tspan></text>
